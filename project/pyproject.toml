[project]
name = "vehicle-detection-service"
version = "0.1.0"
description = "Detection AI engineering project for road object detection"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torchmetrics>=1.4.0",
    "python-multipart>=0.0.9",
    "kagglehub>=0.3.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false